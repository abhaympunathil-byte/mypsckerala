{% extends "base.html" %}

{% block title %}Secure Login - My PSC Kerala{% endblock %}

{% block content %}
<div class="container">
    <div class="row justify-content-center align-items-center" style="min-height: 75vh;">
        <div class="col-md-5">
            <div class="card premium-card p-4 p-md-5 border-0 shadow-lg animate-fade-in-up bg-white">
                <div class="text-center mb-4">
                    <div class="d-inline-flex align-items-center justify-content-center mb-3" style="width: 72px; height: 72px;">
                        <img src="/static/images/logo.jpg" alt="Aspirant Kerala Logo" class="img-fluid rounded-circle border border-success" style="object-fit: cover; width: 100%; height: 100%;">
                    </div>
                    <h2 class="text-dark mb-1">Aspirant Kerala</h2>
                    <p class="text-muted small">Secure Access to Your Academic Journey</p>
                </div>
                
                <form action="{% url 'login' %}" method="post">
                    {% csrf_token %}
                    
                    <div class="mb-3">
                        <label for="email" class="form-label text-dark small fw-semibold">Email Address</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-light text-muted"><i class="fa-regular fa-envelope"></i></span>
                            <input type="email" class="form-control bg-light border-light text-dark" id="email" name="email" required placeholder="student@example.com">
                        </div>
                    </div>
                    
                    <div class="mb-4">
                        <label for="password" class="form-label text-dark small fw-semibold">Password</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-light text-muted"><i class="fa-solid fa-lock"></i></span>
                            <input type="password" class="form-control bg-light border-light text-dark" id="password" name="password" required placeholder="••••••••">
                        </div>
                    </div>
                    
                    <button type="submit" class="btn btn-green w-100 py-3 mb-3">
                        Login & Continue <i class="fa-solid fa-arrow-right-to-bracket ms-1"></i>
                    </button>
                    
                    <div class="text-center">
                        <span class="text-muted small">Don't have an account?</span>
                        <a href="{% url 'register' %}" class="text-success small fw-bold text-decoration-none ms-1">Register here</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
