{% extends "base.html" %}

{% block title %}Login - My PSC Kerala{% endblock %}

{% block content %}
<div class="container">
    <div class="row justify-content-center align-items-center" style="min-height: 70vh;">
        <div class="col-md-5">
            <div class="glass-card p-4 p-md-5 animate-fade-in-up">
                <div class="text-center mb-4">
                    <i class="fa-solid fa-right-to-bracket text-primary fa-3x mb-3"></i>
                    <h2 class="text-white">Welcome Back</h2>
                    <p class="text-muted small">Log in to practice exam modules and check your progress dashboards.</p>
                </div>
                
                <form action="{% url 'login' %}" method="post">
                    {% csrf_token %}
                    
                    <div class="mb-3">
                        <label for="email" class="form-label text-light small fw-medium">Email Address</label>
                        <div class="input-group">
                            <span class="input-group-text bg-transparent border-secondary text-muted"><i class="fa-regular fa-envelope"></i></span>
                            <input type="email" class="form-control bg-transparent border-secondary text-white" id="email" name="email" required placeholder="john@example.com">
                        </div>
                    </div>
                    
                    <div class="mb-4">
                        <label for="password" class="form-label text-light small fw-medium">Password</label>
                        <div class="input-group">
                            <span class="input-group-text bg-transparent border-secondary text-muted"><i class="fa-solid fa-lock"></i></span>
                            <input type="password" class="form-control bg-transparent border-secondary text-white" id="password" name="password" required placeholder="••••••••">
                        </div>
                    </div>
                    
                    <button type="submit" class="btn btn-premium w-100 py-3 mb-3">Login to Dashboard</button>
                    
                    <div class="text-center">
                        <span class="text-muted small">Don't have an account?</span>
                        <a href="{% url 'register' %}" class="text-primary small fw-semibold text-decoration-none ms-1">Register here</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
